function dateOffset(n){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function resp(unit,pic=''){return {unit,pic}}
function step(text,dueOffset,status='NotStarted'){return{id:uid(),text,due:dateOffset(dueOffset),status}}
function activity(id,task,subTask,key,s,e,status,responsibilities,nextSteps=[]){return{id,task,subTask,key,plannedStart:dateOffset(s),plannedEnd:dateOffset(e),actualStart:status==='Completed'?dateOffset(s):'',actualEnd:status==='Completed'?dateOffset(e):'',status,responsibilities,nextSteps}}
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36)}
function clone(x){return JSON.parse(JSON.stringify(x))}
let state=load(); let page='dashboard'; let presentIndex=0; let presentProjectIds=[]; let ganttMode='Week'; let ganttZoom=100; let dashboardFilter={search:'',eventType:'All',status:'All',section:'All',owner:'All'}; let dashboardSort='liveAsc'; let dashboardGroupMode='section';
function migrateState(x){
  if(!x||!x.projects||!x.masters)return clone(seed);
  const current=Number(x.dataVersion||0);
  if(current<DATASET_VERSION){
    x.projects=(x.projects||[]).filter(p=>p.id!=='p-demo');
    const existing=new Set(x.projects.map(p=>p.id));
    seed.projects.forEach(p=>{if(!existing.has(p.id))x.projects.push(clone(p))});
    x.masters=x.masters||{tasks:[],units:[],milestones:[]};
    x.masters.tasks=x.masters.tasks||[]; seed.masters.tasks.forEach(v=>{if(!x.masters.tasks.includes(v))x.masters.tasks.push(v)});
    x.masters.units=x.masters.units||[]; seed.masters.units.forEach(v=>{if(!x.masters.units.includes(v))x.masters.units.push(v)});
    x.masters.milestones=x.masters.milestones||[];
    const mk=new Set(x.masters.milestones.map(m=>m.key)); seed.masters.milestones.forEach(m=>{if(!mk.has(m.key))x.masters.milestones.push(clone(m))});
    x.settings={...(x.settings||{}),appName:'Range Operation Platform'};
    x.version=2;x.dataVersion=DATASET_VERSION;
    if(!x.selectedProjectId||!x.projects.some(p=>p.id===x.selectedProjectId))x.selectedProjectId=x.projects[0]?.id||'';
    localStorage.setItem(STORAGE_KEY,JSON.stringify(x));
  }
  x.dashboard=x.dashboard||{};
  x.dashboard.sections=Array.isArray(x.dashboard.sections)?x.dashboard.sections:[];
  x.projects=(x.projects||[]).map(p=>({...p,dashboardSectionId:p.dashboardSectionId||''}));
  return x;
}
function load(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY));if(x&&x.projects&&x.masters)return migrateState(x)}catch{} const x=clone(seed);x.dashboard={sections:[]};x.projects=(x.projects||[]).map(p=>({...p,dashboardSectionId:''}));return x}

function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function project(id=state.selectedProjectId){return state.projects.find(p=>p.id===id)||state.projects[0]}

function statusPill(s){const cls=s==='InProgress'?'InProgress':s;return `<span class="pill st-${cls}">${STATUS_LABEL[s]||s}</span>`}
function dateVal(s){return s?new Date(s+'T12:00:00').getTime():0}
function days(a,b){return Math.round((dateVal(b)-dateVal(a))/86400000)}
function progress(p){const a=p.activities||[]; if(!a.length)return 0; return Math.round(a.reduce((sum,x)=>sum+(x.status==='Completed'?100:x.status==='InProgress'?60:x.status==='AtRisk'?45:x.status==='Delayed'?35:10),0)/a.length)}
function projectStatus(p){const a=p.activities||[]; if(a.some(x=>x.status==='Delayed'))return'Delayed'; if(a.some(x=>x.status==='AtRisk'))return'AtRisk'; return 'OnTrack'}
function overdueSteps(p){const today=dateVal(dateOffset(0));return (p.activities||[]).flatMap(a=>(a.nextSteps||[]).map(s=>({a,s}))).filter(x=>x.s.status!=='Completed'&&dateVal(x.s.due)<today)}
function upcomingActivities(p,n=14){const t=dateVal(dateOffset(0)),end=t+n*86400000;return (p.activities||[]).filter(a=>dateVal(a.plannedEnd)>=t&&dateVal(a.plannedEnd)<=end&&a.status!=='Completed').sort((a,b)=>dateVal(a.plannedEnd)-dateVal(b.plannedEnd))}
function completedRecent(p,n=21){const t=dateVal(dateOffset(0))-n*86400000;return (p.activities||[]).filter(a=>a.status==='Completed'&&dateVal(a.actualEnd||a.plannedEnd)>=t).sort((a,b)=>dateVal(b.actualEnd||b.plannedEnd)-dateVal(a.actualEnd||a.plannedEnd))}

function startOfWeekMs(msv){const d=new Date(msv);d.setHours(12,0,0,0);const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d.getTime()}
function isoWeek(d){const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));x.setUTCDate(x.getUTCDate()+4-(x.getUTCDay()||7));const y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil((((x-y)/86400000)+1)/7)}

function projectLiveDate(p){const acts=(p.activities||[]).filter(a=>a.plannedEnd);const live=acts.filter(a=>{const t=((a.key||'')+' '+(a.label||'')+' '+(ms(a.key).name||'')).toLowerCase();return t.includes('live')});if(live.length)return live.slice().sort((a,b)=>dateVal(a.plannedEnd)-dateVal(b.plannedEnd)).slice(-1)[0].plannedEnd;const fallback=acts.filter(a=>{const t=((a.key||'')+' '+(a.label||'')+' '+(ms(a.key).name||'')).toLowerCase();return a.key==='IMP'||t.includes('implementation')||t.includes('relaunch')||t.trim().startsWith('go')||t.includes(' go ')});const pick=(fallback.length?fallback:acts).slice().sort((a,b)=>dateVal(a.plannedEnd)-dateVal(b.plannedEnd)).slice(-1)[0];return pick?.plannedEnd||p.plannedEnd||''}
function projectLiveWeek(p){const d=projectLiveDate(p);if(!d)return'-';const dt=new Date(dateVal(d));return 'W'+String(isoWeek(dt)).padStart(2,'0')}
function projectPic(p){const pics=[...new Set((p.activities||[]).flatMap(a=>(a.responsibilities||[]).map(r=>r.pic).filter(Boolean)))];return pics.slice(0,2).join(' / ')||p.owner||'—'}

function uniqueValues(arr){return [...new Set(arr.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b)))}
function dashboardFilteredProjects(){let ps=state.projects.slice();const f=dashboardFilter;if(f.search){const q=f.search.toLowerCase();ps=ps.filter(p=>[p.code,p.name,p.summary,p.eventType,p.owner].some(v=>String(v||'').toLowerCase().includes(q)))}if(f.eventType!=='All')ps=ps.filter(p=>p.eventType===f.eventType);if(f.status!=='All')ps=ps.filter(p=>dashStatus(p)===f.status);if(f.owner!=='All')ps=ps.filter(p=>p.owner===f.owner);if(f.section!=='All')ps=ps.filter(p=>(p.dashboardSectionId||'')===f.section);return ps}
function compareDashboard(a,b){const liveA=dateVal(projectLiveDate(a)),liveB=dateVal(projectLiveDate(b));if(dashboardSort==='liveDesc')return liveB-liveA||a.name.localeCompare(b.name);if(dashboardSort==='projectAsc')return a.name.localeCompare(b.name);if(dashboardSort==='projectDesc')return b.name.localeCompare(a.name);if(dashboardSort==='eventType')return String(a.eventType||'').localeCompare(String(b.eventType||''))||a.name.localeCompare(b.name);if(dashboardSort==='status')return dashStatus(a).localeCompare(dashStatus(b))||a.name.localeCompare(b.name);if(dashboardSort==='planStart')return dateVal(a.plannedStart)-dateVal(b.plannedStart)||a.name.localeCompare(b.name);return liveA-liveB||a.name.localeCompare(b.name)}
function setDashboardFilter(k,v){dashboardFilter[k]=v;render()}
function clearDashboardFilters(){dashboardFilter={search:'',eventType:'All',status:'All',section:'All',owner:'All'};dashboardSort='liveAsc';render()}
function renderDashboard(){const all=state.projects,ps=dashboardFilteredProjects().sort(compareDashboard);const now=new Date(),q=Math.floor(now.getMonth()/3)+1;const events=uniqueValues(all.map(p=>p.eventType)),owners=uniqueValues(all.map(p=>p.owner)),sections=dashboardSections();return `<div class="page"><div class="portfolio-head"><div class="portfolio-title"><h1>Range Operation: Project update</h1><div class="portfolio-period">Q${q}-${now.getFullYear()}</div></div><div style="display:flex;align-items:center;gap:12px"><div class="portfolio-legend"><span><i class="legend-phase"></i>Active Phase</span><span><i class="legend-ms"></i>Milestone</span></div><button class="btn" onclick="openSectionManager()">Manage Sections</button><button class="btn primary" onclick="openProjectModal()">+ New Project</button></div></div><div class="dashboard-controls"><div class="dashboard-control search"><label>Search</label><input value="${esc(dashboardFilter.search)}" placeholder="Project / code / update" oninput="dashboardFilter.search=this.value;render()"></div><div class="dashboard-control"><label>Event Type</label><select onchange="setDashboardFilter('eventType',this.value)"><option>All</option>${events.map(v=>`<option ${dashboardFilter.eventType===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div><div class="dashboard-control"><label>Status</label><select onchange="setDashboardFilter('status',this.value)">${['All','WIP','Done','At Risk','Delayed'].map(v=>`<option ${dashboardFilter.status===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="dashboard-control"><label>Section</label><select onchange="setDashboardFilter('section',this.value)"><option value="All" ${dashboardFilter.section==='All'?'selected':''}>All</option><option value="" ${dashboardFilter.section===''?'selected':''}>Unassigned</option>${sections.map(s=>`<option value="${esc(s.id)}" ${dashboardFilter.section===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="dashboard-control"><label>Owner</label><select onchange="setDashboardFilter('owner',this.value)"><option>All</option>${owners.map(v=>`<option ${dashboardFilter.owner===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div><div class="dashboard-control"><label>Sort</label><select onchange="dashboardSort=this.value;render()"><option value="liveAsc" ${dashboardSort==='liveAsc'?'selected':''}>Live week ↑</option><option value="liveDesc" ${dashboardSort==='liveDesc'?'selected':''}>Live week ↓</option><option value="projectAsc" ${dashboardSort==='projectAsc'?'selected':''}>Project A–Z</option><option value="projectDesc" ${dashboardSort==='projectDesc'?'selected':''}>Project Z–A</option><option value="eventType" ${dashboardSort==='eventType'?'selected':''}>Event Type</option><option value="status" ${dashboardSort==='status'?'selected':''}>Status</option><option value="planStart" ${dashboardSort==='planStart'?'selected':''}>Plan Start</option></select></div><div class="dashboard-control"><label>Report View</label><select onchange="dashboardGroupMode=this.value;render()"><option value="section" ${dashboardGroupMode==='section'?'selected':''}>Custom Sections</option><option value="flat" ${dashboardGroupMode==='flat'?'selected':''}>All Projects</option></select></div><div class="dashboard-control-actions"><button class="btn" onclick="clearDashboardFilters()">Clear</button><span class="small">${ps.length}/${all.length} projects</span></div></div>${renderPortfolioGantt(ps)}</div>`}
function milestoneLayout(acts,min,width,weekW){const points=acts.map((a,i)=>{const x=(dateVal(a.plannedEnd)-min)/(7*86400000)*weekW;const label=String(a.key||'');const half=Math.min(62,Math.max(22,label.length*3.4+9));return {a,x,half,i}}).filter(o=>o.x>=0&&o.x<=width).sort((a,b)=>a.x-b.x||a.i-b.i);const lastRight=[];for(const p of points){let level=0;while(level<lastRight.length&&p.x-p.half<=lastRight[level]+8)level++;p.level=level;lastRight[level]=p.x+p.half;}return {points,maxLevel:points.reduce((m,p)=>Math.max(m,p.level),0)}}
function renderPortfolioGantt(ps){if(!ps.length)return`<div class="card portfolio-empty">No projects match the current dashboard filters.</div>`;const day=86400000,weekW=52;const starts=ps.flatMap(p=>[p.plannedStart,...(p.activities||[]).map(a=>a.plannedStart)]).filter(Boolean).map(dateVal);const ends=ps.flatMap(p=>[p.plannedEnd,...(p.activities||[]).map(a=>a.plannedEnd)]).filter(Boolean).map(dateVal);const today=dateVal(dateOffset(0));let min=Math.min(today,...starts),max=Math.max(today,...ends);min=startOfWeekMs(min-7*day);max=startOfWeekMs(max+14*day)+7*day;const weeks=Math.max(1,Math.ceil((max-min)/(7*day)));const width=weeks*weekW;const weekItems=[];for(let i=0;i<weeks;i++){const dt=new Date(min+i*7*day);weekItems.push({i,dt,label:'W'+String(isoWeek(dt)).padStart(2,'0')})}const monthGroups=[];for(const w of weekItems){const pivot=new Date(w.dt.getTime()+3*day);const key=pivot.getFullYear()+'-'+pivot.getMonth();const label=pivot.toLocaleDateString('en',{month:'long'});const last=monthGroups[monthGroups.length-1];if(last&&last.key===key)last.count++;else monthGroups.push({key,label,count:1})}const months=monthGroups.map(m=>`<div class="portfolio-month" style="width:${m.count*weekW}px">${esc(m.label)}</div>`).join('');const weekHeads=weekItems.map(w=>`<div class="portfolio-week" style="left:${w.i*weekW}px;width:${weekW}px">${w.label}</div>`).join('');const todayX=(today-min)/(7*day)*weekW;
const rowHtml=p=>{const acts=(p.activities||[]).filter(a=>a.plannedStart&&a.plannedEnd).slice().sort((a,b)=>dateVal(a.plannedEnd)-dateVal(b.plannedEnd));const validStart=p.plannedStart||acts[0]?.plannedStart||dateOffset(0),validEnd=p.plannedEnd||acts[acts.length-1]?.plannedEnd||validStart;const pStart=Math.max(min,dateVal(validStart)),pEnd=Math.min(max,dateVal(validEnd));const startX=Math.max(0,(pStart-min)/(7*day)*weekW),endX=Math.min(width,(pEnd-min)/(7*day)*weekW),barW=Math.max(3,endX-startX);const layout=milestoneLayout(acts,min,width,weekW);const rowH=Math.max(84,84+layout.maxLevel*23);const phaseY=rowH-19;const labels=layout.points.map(o=>{const a=o.a,m=ms(a.key),labelTop=6+o.level*23,markerTop=30+o.level*23,stemTop=markerTop+17,stemH=Math.max(2,phaseY-stemTop);const title=`${m.key} · ${m.name}\n${a.plannedEnd}\n${STATUS_LABEL[a.status]||a.status}`;return `<span class="portfolio-ms-label" style="left:${o.x}px;--ms-label-top:${labelTop}px" title="${esc(title)}">${esc(a.key)}</span><i class="portfolio-milestone" style="left:${o.x}px;--ms-marker-top:${markerTop}px" title="${esc(title)}"></i><i class="portfolio-ms-stem" style="left:${o.x}px;top:${stemTop}px;height:${stemH}px"></i>`}).join('');const stat=dashStatus(p),cls=stat==='Delayed'?'delay':stat==='At Risk'?'risk':'';const summary=p.risk?`Issue: ${p.risk}`:(p.summary||p.eventType||'');return `<div class="portfolio-row" style="min-height:${rowH}px;--row-height:${rowH}px"><div class="portfolio-event">${esc(p.eventType||'-')}</div><div class="portfolio-process"><span class="project-link" onclick="openDetail('${p.id}')">${esc(p.name)}</span><div class="portfolio-process-summary">${esc(summary)}</div></div><div class="portfolio-live" title="${esc(projectLiveDate(p))}">${esc(projectLiveWeek(p))}</div><div class="portfolio-status ${cls}">${esc(stat)}</div><div class="portfolio-track" style="width:${width}px;background-size:${weekW}px 100%;--row-height:${rowH}px"><div class="portfolio-phase" style="left:${startX}px;width:${barW}px" title="${esc(p.plannedStart)} → ${esc(p.plannedEnd)}"></div>${labels}</div></div>`};
let body='';if(dashboardGroupMode==='section'){const configured=dashboardSections();const groups=[];configured.forEach(s=>{const items=ps.filter(p=>p.dashboardSectionId===s.id).sort(compareDashboard);if(items.length)groups.push({id:s.id,name:s.name,items})});const unassigned=ps.filter(p=>!p.dashboardSectionId||!configured.some(s=>s.id===p.dashboardSectionId)).sort(compareDashboard);if(unassigned.length)groups.push({id:'',name:'Unassigned',items:unassigned});body=groups.map(g=>`<div class="portfolio-section-row" style="grid-template-columns:626px ${width}px"><div class="portfolio-section-title">${esc(g.name)} <span class="portfolio-section-count">${g.items.length}</span></div><div class="portfolio-section-time" style="width:${width}px;background-size:${weekW}px 100%"></div></div>${g.items.map(rowHtml).join('')}`).join('')}else body=ps.slice().sort(compareDashboard).map(rowHtml).join('');return `<div class="portfolio-gantt-wrap"><div class="portfolio-gantt"><div class="portfolio-axis"><div class="portfolio-left-head"><div>Event Type</div><div>Project</div><div>Live week</div><div>Status</div></div><div class="portfolio-time-head" style="width:${width}px"><div class="portfolio-now-badge" style="left:${todayX}px">We're here</div><div class="portfolio-months">${months}</div><div class="portfolio-weeks">${weekHeads}</div></div></div>${body}<i class="portfolio-today-line" style="left:${626+todayX}px"></i></div></div>`}
function openSectionManager(){const sections=dashboardSections();showModal(`<div class="modal-head"><h2>Dashboard Custom Sections</h2><button class="btn sm" onclick="closeModal()">×</button></div><div class="modal-body"><div style="display:flex;gap:8px;margin-bottom:12px"><input id="newSectionName" placeholder="New section name" style="flex:1;border:1px solid var(--line);border-radius:8px;padding:9px"><button class="btn primary" onclick="addDashboardSection()">+ Add Section</button></div><div class="section-manager-list">${sections.map((s,i)=>`<div class="section-manager-row"><div class="section-order">${i+1}</div><div><b>${esc(s.name)}</b><div class="small">${state.projects.filter(p=>p.dashboardSectionId===s.id).length} project(s)</div></div><div><button class="btn sm" onclick="moveDashboardSection(${i},-1)">↑</button> <button class="btn sm" onclick="moveDashboardSection(${i},1)">↓</button> <button class="btn sm" onclick="renameDashboardSection('${s.id}')">Rename</button> <button class="btn sm danger" onclick="deleteDashboardSection('${s.id}')">Delete</button></div></div>`).join('')||'<div class="small">No custom sections yet.</div>'}</div><div class="section-title" style="margin-top:18px">Assign Projects to Sections</div><div class="section-project-list">${state.projects.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<div class="section-project-row"><div><b>${esc(p.name)}</b><div class="small">${esc(p.eventType||'')}</div></div><select onchange="assignDashboardSection('${p.id}',this.value)"><option value="">Unassigned</option>${sections.map(s=>`<option value="${s.id}" ${p.dashboardSectionId===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>`).join('')}</div></div><div class="modal-foot"><button class="btn primary" onclick="closeModal();render()">Done</button></div>`)}
function addDashboardSection(){const input=document.getElementById('newSectionName'),name=(input?.value||'').trim();if(!name)return;state.dashboard=state.dashboard||{sections:[]};state.dashboard.sections.push({id:'sec-'+uid(),name});save();openSectionManager()}
function renameDashboardSection(id){const s=dashboardSections().find(x=>x.id===id);if(!s)return;const name=prompt('Section name',s.name);if(name&&name.trim()){s.name=name.trim();save();openSectionManager()}}
function moveDashboardSection(i,d){const a=dashboardSections(),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();openSectionManager()}
function deleteDashboardSection(id){const s=dashboardSections().find(x=>x.id===id);if(!s||!confirm(`Delete section "${s.name}"? Projects will become Unassigned.`))return;state.projects.forEach(p=>{if(p.dashboardSectionId===id)p.dashboardSectionId=''});state.dashboard.sections=state.dashboard.sections.filter(x=>x.id!==id);if(dashboardFilter.section===id)dashboardFilter.section='All';save();openSectionManager()}
function assignDashboardSection(projectId,sectionId){const p=project(projectId);if(p){p.dashboardSectionId=sectionId;save()}}
function projectTable(ps){if(!ps.length)return`<div class="empty">No projects.</div>`;return`<div class="table-wrap"><table class="table"><thead><tr><th>Project</th><th>Division</th><th>Owner</th><th>Plan</th><th>Status</th><th>Progress</th><th>Due Soon</th><th>Overdue</th><th></th></tr></thead><tbody>${ps.map(p=>`<tr><td><span class="project-link" onclick="openDetail('${p.id}')">${esc(p.code)} · ${esc(p.name)}</span><div class="small">${esc(p.eventType)}</div></td><td>${esc(p.division)} / ${esc(p.department)}</td><td>${esc(p.owner)}</td><td>${esc(p.plannedStart)} → ${esc(p.plannedEnd)}</td><td>${statusPill(projectStatus(p))}</td><td><b>${progress(p)}%</b><div class="progress"><i style="width:${progress(p)}%"></i></div></td><td>${upcomingActivities(p,14).length}</td><td class="${overdueSteps(p).length?'danger-text':''}">${overdueSteps(p).length}</td><td><button class="btn sm" onclick="openDetail('${p.id}')">Open</button></td></tr>`).join('')}</tbody></table></div>`}

function openDetail(id){state.selectedProjectId=id;save();page='detail';render()}
function renderDetail(){const p=project();if(!p)return`<div class="page"><div class="empty">Create a project first.</div></div>`;const grouped={};(p.activities||[]).forEach(a=>{grouped[a.task]??={};grouped[a.task][a.subTask]??=[];grouped[a.task][a.subTask].push(a)});return `<div class="page"><div class="page-head"><div><h1>${esc(p.code)} · ${esc(p.name)}</h1><div class="sub">${esc(p.eventType)} · ${esc(p.division)} / ${esc(p.department)} · ${esc(p.format)}</div></div><div class="toolbar"><button class="btn" onclick="openProjectModal('${p.id}')">Edit Project</button><button class="btn primary" onclick="openActivityModal()">+ Add Activity</button></div></div><div class="summary-grid"><div class="mini"><span>Status</span><b>${statusPill(projectStatus(p))}</b></div><div class="mini"><span>Progress</span><b>${progress(p)}%</b></div><div class="mini"><span>Owner</span><b>${esc(p.owner)}</b></div><div class="mini"><span>Plan Start</span><b>${esc(p.plannedStart)}</b></div><div class="mini"><span>Plan End</span><b>${esc(p.plannedEnd)}</b></div><div class="mini"><span>Overdue Actions</span><b class="${overdueSteps(p).length?'danger-text':''}">${overdueSteps(p).length}</b></div></div><div class="card section"><div class="section-title" style="display:flex;align-items:center;gap:8px">Gantt Timeline <span class="small">Task → Sub Task → Key Milestone</span><span class="gantt-edit-hint"><i></i>Click = Edit · Drag = Move · Drag edge = Resize</span><span style="margin-left:auto"></span><select onchange="ganttMode=this.value;render()"><option ${ganttMode==='Day'?'selected':''}>Day</option><option ${ganttMode==='Week'?'selected':''}>Week</option><option ${ganttMode==='Month'?'selected':''}>Month</option></select><button class="btn sm" onclick="ganttZoom=Math.max(25,ganttZoom-25);render()">−</button><span class="small">${ganttZoom}%</span><button class="btn sm" onclick="ganttZoom=Math.min(200,ganttZoom+25);render()">+</button></div>${renderGantt(p)}</div><div class="split" style="margin-top:14px"><div class="card section"><div class="section-title">Detail Plan Structure</div><div class="structure">${Object.entries(grouped).map(([task,subs])=>`<div class="task-card"><div class="task-head"><span>${esc(task)}</span><button class="btn sm" onclick="openActivityModal('',${JSON.stringify(task)})">+ Milestone</button></div>${Object.entries(subs).map(([sub,items])=>`<div class="subtask"><div class="sub-head"><b>${esc(sub)}</b><span class="small">${items.length} milestone(s)</span></div>${items.sort((a,b)=>dateVal(a.plannedStart)-dateVal(b.plannedStart)).map(a=>renderActivity(p,a)).join('')}</div>`).join('')}</div>`).join('')||'<div class="empty">No activities.</div>'}</div></div><div><div class="card section"><div class="section-title">Presentation Notes</div><div class="ff"><label>Project Summary</label><textarea onchange="updateProjectText('summary',this.value)">${esc(p.summary||'')}</textarea></div><div class="ff" style="margin-top:10px"><label>Risk / Issue</label><textarea onchange="updateProjectText('risk',this.value)">${esc(p.risk||'')}</textarea></div><div class="ff" style="margin-top:10px"><label>Decision / Support Needed</label><textarea onchange="updateProjectText('decision',this.value)">${esc(p.decision||'')}</textarea></div><div style="margin-top:12px"><button class="btn primary" onclick="startPresentation('${p.id}')">Present This Project</button></div></div><div class="card section" style="margin-top:14px"><div class="section-title">Upcoming 14 Days</div>${upcomingActivities(p,14).map(a=>`<div class="bullet"><span class="dot"></span><div><b>${esc(a.key)} · ${esc(a.label||ms(a.key).name)}</b><div class="small">Due ${esc(a.plannedEnd)} · ${STATUS_LABEL[a.status]}</div></div></div>`).join('')||'<div class="small">No milestone due.</div>'}</div></div></div></div>`}
function renderActivity(p,a){const m=ms(a.key);return `<div class="activity"><div class="code" style="background:${m.color};cursor:pointer" title="Click to edit milestone" onclick="openActivityModal('${a.id}')">${esc(a.key)}</div><div><b>${esc(a.label||m.name)}</b><div class="small">${esc(a.task)} → ${esc(a.subTask)}</div></div><div><b>${esc((a.responsibilities||[]).map(r=>r.pic||r.unit).join(', ')||'—')}</b><div class="small">${esc((a.responsibilities||[]).map(r=>r.unit).join(' / '))}</div></div><div>${esc(a.plannedStart)}</div><div>${esc(a.plannedEnd)}</div><div>${statusPill(a.status)}</div><div class="right"><button class="btn sm" onclick="openActivityModal('${a.id}')">Edit</button> <button class="btn sm danger" onclick="deleteActivity('${a.id}')">Delete</button></div></div><div class="next-steps"><div class="small"><b>Next Steps</b></div>${(a.nextSteps||[]).map((s,i)=>`<div class="next-row"><input value="${esc(s.text)}" onchange="updateStep('${a.id}','${s.id}','text',this.value)"><input type="date" value="${esc(s.due)}" onchange="updateStep('${a.id}','${s.id}','due',this.value)"><select onchange="updateStep('${a.id}','${s.id}','status',this.value)"><option value="NotStarted" ${s.status==='NotStarted'?'selected':''}>Not Started</option><option value="InProgress" ${s.status==='InProgress'?'selected':''}>In Progress</option><option value="Completed" ${s.status==='Completed'?'selected':''}>Completed</option></select><button class="btn sm danger" onclick="deleteStep('${a.id}','${s.id}')">×</button></div>`).join('')}<button class="btn sm" style="margin-top:7px" onclick="addStep('${a.id}')">+ Add Next Step</button></div>`}
function renderGantt(p){const acts=(p.activities||[]).slice().sort((a,b)=>dateVal(a.plannedStart)-dateVal(b.plannedStart));if(!acts.length)return'<div class="empty">No activities.</div>';const day=86400000;let min=Math.min(...acts.map(a=>dateVal(a.plannedStart))),max=Math.max(...acts.map(a=>dateVal(a.plannedEnd)));min-=3*day;max+=3*day;const zoom=ganttZoom/100;const cellDay=36*zoom,cellWeek=56*zoom,cellMonth=120*zoom;let width=1200,cell=cellDay,headerRows='',weekendHtml='',dateCells='',weekCells='',monthCells='',unit='day';

else if(ganttMode==='Week'){const start=startOfWeekMs(min);const end=startOfWeekMs(max)+7*day;const totalWeeks=Math.max(1,Math.ceil((end-start)/(7*day)));width=Math.max(1200,totalWeeks*cellWeek);cell=cellWeek;for(let i=0;i<totalWeeks;i++){const dt=new Date(start+i*7*day);weekCells+=`<div class="axis-group" style="left:${i*cell}px;width:${cell}px">W${String(isoWeek(dt)).padStart(2,'0')}</div>`;}let i=0;while(i<totalWeeks){const dt=new Date(start+i*7*day+3*day);const key=dt.getFullYear()+'-'+dt.getMonth();let j=i+1;while(j<totalWeeks){const d2=new Date(start+j*7*day+3*day);if((d2.getFullYear()+'-'+d2.getMonth())!==key)break;j++;}monthCells+=`<div class="axis-group" style="left:${i*cell}px;width:${(j-i)*cell}px">${dt.toLocaleDateString('en',{month:'short',year:'numeric'})}</div>`;i=j;}headerRows=`<div class="axis-row months" style="width:${width}px">${monthCells}</div><div class="axis-row weeks" style="width:${width}px">${weekCells}</div>`;min=start;max=end-day;unit='week';}

function shiftActivityDates(a,mode,steps){if(!steps)return;const day=86400000;if(mode==='month'){a.plannedStart=addMonthsDate(a.plannedStart,steps);a.plannedEnd=addMonthsDate(a.plannedEnd,steps)}else{const mult=mode==='week'?7:1;a.plannedStart=formatDateMs(dateVal(a.plannedStart)+steps*mult*day);a.plannedEnd=formatDateMs(dateVal(a.plannedEnd)+steps*mult*day)}}

function moveItem(type,i,d){const a=state.masters[type],j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render()}
function deleteMaster(type,i){if(!confirm('Delete this master item?'))return;state.masters[type].splice(i,1);save();render()}
function addMasterTask(){const x=prompt('Task name');if(x&&!state.masters.tasks.includes(x)){state.masters.tasks.push(x.trim());save();render()}}
function addUnitMaster(){const x=prompt('Responsible Unit name');if(x&&!state.masters.units.includes(x)){state.masters.units.push(x.trim());save();render()}}
function addMilestoneMaster(){showMilestoneModal(-1)}function editMilestoneMaster(i){showMilestoneModal(i)}
function showMilestoneModal(i){const m=i>=0?clone(state.masters.milestones[i]):{key:'',name:'',color:COLORS[state.masters.milestones.length%COLORS.length],units:[]};showModal(`<div class="modal-head"><h2>${i>=0?'Edit':'Add'} Key Milestone</h2><button class="btn sm" onclick="closeModal()">×</button></div><div class="modal-body"><div class="form-grid">${ff('Code','mmKey',m.key)}${ff('Milestone Name','mmName',m.name)}<div class="ff"><label>Color</label><input id="mmColor" type="color" value="${esc(m.color)}"></div><div class="ff"><label>Responsible Units</label><select id="mmUnits" multiple size="5">${state.masters.units.map(u=>`<option ${m.units.includes(u)?'selected':''}>${esc(u)}</option>`).join('')}</select></div></div></div><div class="modal-foot">${i>=0?`<button class="btn danger" onclick="deleteMilestoneMaster(${i})">Delete</button>`:''}<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveMilestoneMaster(${i})">Save</button></div>`)}
function saveMilestoneMaster(i){const key=v('mmKey').toUpperCase(),name=v('mmName'),color=document.getElementById('mmColor').value,units=[...document.getElementById('mmUnits').selectedOptions].map(o=>o.value);if(!key||!name)return alert('Code and Name required.');const m={key,name,color,units};if(i>=0)state.masters.milestones[i]=m;else state.masters.milestones.push(m);save();closeModal();render()}
function deleteMilestoneMaster(i){const key=state.masters.milestones[i].key;if(state.projects.some(p=>p.activities.some(a=>a.key===key)))return alert('This milestone is used by a project and cannot be deleted.');state.masters.milestones.splice(i,1);save();closeModal();render()}
function exportJson(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='range-plan-presenter-backup-'+dateOffset(0)+'.json';a.click();URL.revokeObjectURL(a.href)}
function importJson(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.projects||!x.masters)throw new Error('Invalid backup');state=x;save();render();alert('Import completed.')}catch(err){alert(err.message)}};r.readAsText(f);e.target.value=''}
async function syncServer(){try{const res=await fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)});const x=await res.json();if(!x.ok)throw new Error(x.error||'Save failed');alert('Server state saved.')}catch(e){alert('Server save failed: '+e.message)}}
render();
</script>
</body>
</html>
