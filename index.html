<html lang="en">
<head>

<title>Range Plan Presenter</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#182230;--muted:#6b7688;--line:#dde4ef;--primary:#3157d5;--primary2:#5b67e8;--green:#1f9d68;--amber:#d18b12;--red:#d44a55;--purple:#7b5de4;--shadow:0 8px 26px rgba(30,49,90,.08)}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial;color:var(--text);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.topbar{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 22px;position:sticky;top:0;z-index:20}.brand{font-weight:800;font-size:18px;color:#1d347d}.brand small{font-weight:600;color:var(--muted);margin-left:8px}.nav{display:flex;gap:6px;flex:1}.nav button{border:0;background:transparent;padding:10px 12px;border-radius:9px;color:#566174}.nav button.active{background:#eef2ff;color:var(--primary);font-weight:700}.toolbar{display:flex;gap:8px;align-items:center}.btn{border:1px solid var(--line);background:#fff;color:#344054;padding:8px 12px;border-radius:8px;font-weight:650}.btn:hover{background:#f8faff}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.danger{color:var(--red)}.btn.sm{padding:5px 8px;font-size:12px}.page{padding:22px;max-width:1600px;margin:auto}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:18px}.page-head h1{margin:0;font-size:25px}.sub{color:var(--muted);margin-top:4px}.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(6,minmax(130px,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.kpi{padding:16px}.kpi span{color:var(--muted);font-size:12px}.kpi b{display:block;font-size:26px;margin-top:4px}.section{padding:16px}.section-title{font-weight:800;font-size:15px;margin-bottom:12px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.filters input,.filters select{border:1px solid var(--line);background:#fff;padding:9px 10px;border-radius:8px;min-width:150px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px 9px;border-bottom:1px solid #edf1f6;text-align:left;vertical-align:top}.table th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#6a7689;background:#fafbfe;position:sticky;top:0}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:750}.st-OnTrack,.st-Completed{background:#e8f7f0;color:#13754b}.st-AtRisk{background:#fff5df;color:#9a6508}.st-Delayed{background:#fdecee;color:#aa2836}.st-InProgress{background:#eaf0ff;color:#3157d5}.st-Upcoming{background:#eef1f5;color:#657082}.progress{height:7px;border-radius:6px;background:#edf1f6;overflow:hidden;min-width:90px}.progress i{height:100%;display:block;background:var(--primary)}.project-link{font-weight:750;color:#2448ba;cursor:pointer}.empty{padding:32px;text-align:center;color:var(--muted)}.split{display:grid;grid-template-columns:minmax(0,2fr) minmax(310px,1fr);gap:14px}.summary-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}.mini{padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}.mini span{display:block;color:var(--muted);font-size:11px}.mini b{display:block;margin-top:4px}.structure{display:flex;flex-direction:column;gap:10px}.task-card{border:1px solid var(--line);border-radius:10px;overflow:hidden}.task-head{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;background:#f7f9fc;font-weight:800}.subtask{padding:10px 12px;border-top:1px solid var(--line)}.sub-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.activity{display:grid;grid-template-columns:95px minmax(160px,1.4fr) minmax(150px,1fr) 100px 100px 105px 120px;gap:8px;align-items:center;padding:8px;border:1px solid #ebeff5;border-radius:8px;margin-top:7px}.code{font-weight:850;color:#fff;border-radius:7px;padding:6px 8px;text-align:center}.small{font-size:12px;color:var(--muted)}.next-steps{margin-top:8px;padding-left:10px;border-left:3px solid #e5eaf2}.next-row{display:grid;grid-template-columns:minmax(180px,1fr) 110px 110px auto;gap:8px;align-items:center;margin-top:6px}.next-row input,.next-row select{border:1px solid var(--line);padding:7px;border-radius:7px;width:100%}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.ff label{display:block;font-size:12px;color:#5e697c;font-weight:700;margin-bottom:4px}.ff input,.ff select,.ff textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;background:#fff}.ff textarea{min-height:82px;resize:vertical}.modal{position:fixed;inset:0;background:rgba(12,20,40,.46);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.hidden{display:none}.modal-card{background:#fff;width:min(840px,96vw);max-height:92vh;overflow:auto;border-radius:14px;box-shadow:0 24px 70px rgba(10,20,50,.28)}.modal-head,.modal-foot{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-head h2{font-size:18px;margin:0}.modal-foot{border-top:1px solid var(--line);border-bottom:0;justify-content:flex-end;gap:8px}.modal-body{padding:16px}.gantt-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff}.gantt{min-width:900px}.gantt-row{display:grid;grid-template-columns:260px 1fr;min-height:36px;border-bottom:1px solid #edf1f5}.gantt-label{padding:8px 10px;border-right:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.gantt-track{position:relative;background-image:linear-gradient(to right,#edf1f5 1px,transparent 1px);background-size:var(--cell,30px) 100%}.gantt-bar{position:absolute;top:8px;height:20px;border-radius:6px;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;padding:0 6px;white-space:nowrap;overflow:hidden}.today{position:absolute;top:0;bottom:0;width:2px;background:#e24251;z-index:3}.gantt-axis{display:grid;grid-template-columns:260px 1fr;border-bottom:1px solid var(--line);position:sticky;top:0;background:white;z-index:4}.axis-track{height:42px;position:relative;overflow:hidden}.axis-label{position:absolute;top:4px;font-size:10px;color:#667085;white-space:nowrap;transform:translateX(2px)}.present-shell{background:#0f172a;min-height:calc(100vh - 64px);padding:16px}.slide{aspect-ratio:16/9;max-width:1500px;margin:auto;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 20px 70px rgba(0,0,0,.35);display:grid;grid-template-rows:auto 1fr auto}.slide-head{padding:28px 34px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:20px}.slide-title{font-size:28px;font-weight:850}.slide-body{padding:20px 34px;display:grid;grid-template-columns:1.15fr .85fr;gap:18px;min-height:0}.slide-left,.slide-right{display:flex;flex-direction:column;gap:14px;min-height:0}.slide-card{border:1px solid var(--line);border-radius:12px;padding:14px;overflow:hidden}.slide-card h3{font-size:13px;margin:0 0 9px;text-transform:uppercase;letter-spacing:.04em;color:#596579}.metric-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.slide-metric{background:#f7f9fc;border-radius:9px;padding:10px}.slide-metric span{display:block;font-size:10px;color:var(--muted)}.slide-metric b{display:block;font-size:18px;margin-top:2px}.bullet{display:flex;gap:8px;margin:7px 0}.dot{width:8px;height:8px;border-radius:50%;background:var(--primary);margin-top:6px;flex:0 0 auto}.slide-foot{padding:10px 34px;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.master-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.master-list{padding:14px}.master-item{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid #edf1f5}.color-dot{width:12px;height:12px;border-radius:3px;display:inline-block;margin-right:6px}.danger-text{color:var(--red)}.right{text-align:right}.hidden{display:none!important}

/* Portfolio Gantt dashboard — styled from the supplied ROM Development plan */
.portfolio-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:12px}.portfolio-title h1{margin:0;font-size:30px;color:#1767a8}.portfolio-period{font-size:20px;font-weight:850;color:#f5b400;margin-top:2px}.portfolio-legend{display:flex;align-items:center;gap:18px;padding:8px 10px;border:1px dotted #8d98a8;background:#fff;font-size:11px}.legend-phase{width:22px;height:13px;background:#2374b6;display:inline-block;margin-right:6px;vertical-align:middle}.legend-ms{width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:18px solid #f7b500;display:inline-block;margin-right:6px;vertical-align:middle}.portfolio-gantt-wrap{overflow:auto;border:1px solid var(--line);background:#fff;border-radius:10px}.portfolio-gantt{position:relative;min-width:max-content}.portfolio-axis,.portfolio-row{display:grid;grid-template-columns:300px 130px 86px auto}.portfolio-axis{position:sticky;top:0;z-index:8;background:#fff}.portfolio-left-head{display:grid;grid-template-columns:300px 130px 86px;grid-column:1/4;align-items:end;border-right:1px solid #aeb8c6;border-bottom:1px solid #111}.portfolio-left-head>div{padding:7px 10px;font-weight:800}.portfolio-time-head{grid-column:4;position:relative;border-bottom:1px solid #111;background:#f7f7f7;padding-top:34px}.portfolio-months{height:38px;display:flex;background:#2374b6;color:#fff}.portfolio-month{height:38px;display:flex;align-items:center;justify-content:center;border-right:2px solid #fff;font-size:16px;font-weight:800;white-space:nowrap}.portfolio-weeks{height:28px;position:relative;background:#eef0f2}.portfolio-week{position:absolute;top:0;height:28px;border-right:1px solid #fff;display:flex;align-items:center;justify-content:center;color:#708099;font-size:12px}.portfolio-now-badge{position:absolute;top:2px;transform:translateX(-50%);z-index:12;background:#fff;color:#d22d3b;border:2px solid #f22b35;border-radius:7px;padding:5px 10px;font-size:11px;font-weight:850;white-space:nowrap}.portfolio-row{min-height:84px;border-bottom:1px dotted #303030}.portfolio-process,.portfolio-pic,.portfolio-status{padding:8px 10px;display:flex;align-items:center;background:#fff}.portfolio-process{align-items:flex-start;flex-direction:column;gap:2px}.portfolio-process .project-link{font-size:14px;color:#0a67ad}.portfolio-process-summary{font-size:12px;color:#0b6cb8;line-height:1.25;max-width:280px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.portfolio-pic{white-space:pre-line;line-height:1.2}.portfolio-status{justify-content:center;color:#1670b6;font-weight:700}.portfolio-status.delay{color:var(--red)}.portfolio-status.risk{color:var(--amber)}.portfolio-track{position:relative;background-color:#f3f3f3;background-image:linear-gradient(to right,rgba(255,255,255,.95) 1px,transparent 1px);overflow:visible}.portfolio-phase{position:absolute;height:14px;top:49px;background:#2374b6;min-width:3px}.portfolio-phase::after{content:'';position:absolute;right:-10px;top:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:10px solid #2374b6}.portfolio-milestone{position:absolute;top:35px;transform:translateX(-50%);z-index:4;width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-bottom:18px solid #f7b500;filter:drop-shadow(0 1px 0 rgba(0,0,0,.16))}.portfolio-ms-label{position:absolute;top:4px;transform:translateX(-50%);font-size:9px;line-height:1.05;color:#2f3743;text-align:center;white-space:nowrap;z-index:5;max-width:70px;overflow:hidden;text-overflow:ellipsis}.portfolio-today-line{position:absolute;top:0;bottom:0;border-left:2px dashed #f0222d;z-index:7;pointer-events:none}.portfolio-track-grid{position:absolute;inset:0;pointer-events:none}.portfolio-empty{padding:40px;text-align:center;color:var(--muted)}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.summary-grid{grid-template-columns:repeat(3,1fr)}.split{grid-template-columns:1fr}.activity{grid-template-columns:90px 1fr 1fr 90px 90px}.activity .hide-small{display:none}.master-grid{grid-template-columns:1fr}.slide{aspect-ratio:auto;min-height:900px}.slide-body{grid-template-columns:1fr}.metric-row{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.topbar{height:auto;flex-wrap:wrap;padding:10px}.nav{overflow:auto}.page{padding:12px}.kpis,.summary-grid{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.activity{display:block}.activity>div{margin:5px 0}.next-row{grid-template-columns:1fr}.slide-head,.slide-body,.slide-foot{padding-left:16px;padding-right:16px}.slide-title{font-size:22px}}
@media print{.topbar,.present-controls{display:none!important}.present-shell{padding:0;background:#fff}.slide{box-shadow:none;border-radius:0;max-width:none;width:100vw;height:56.25vw;page-break-after:always}}
</style>

<body>
<div class="app">
  <header class="topbar">
    <div class="brand">RANGE PLAN <small>Presenter</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="toolbar">
      <button class="btn sm" onclick="exportJson()">Export</button>
      <button class="btn sm" onclick="document.getElementById('importFile').click()">Import</button>
      <input id="importFile" type="file" accept="application/json" hidden onchange="importJson(event)">
      <button class="btn sm" onclick="syncServer()">Save Server</button>
    </div>
  </header>
  <main id="root"></main>
</div>
<div id="modal" class="modal hidden"><div class="modal-card" id="modalCard"></div></div>
<script>
const STORAGE_KEY='range-plan-presenter-v1';
const STATUS=['Upcoming','InProgress','Completed','AtRisk','Delayed'];
const STATUS_LABEL={Upcoming:'Upcoming',InProgress:'In Progress',Completed:'Completed',AtRisk:'At Risk',Delayed:'Delayed',OnTrack:'On Track'};
const COLORS=['#3157d5','#7357ff','#00a3ff','#1f9d68','#d18b12','#d44a55','#7b5de4','#1685a9','#a755b7','#526274','#e46c3c'];
const seed={
  version:1,
  settings:{appName:'Range Plan Presenter'},
  masters:{
    tasks:['Governance','Range & Space','Drawing & Layout','Store Execution','Project Execution'],
    units:['RCPM','RCA','Display','Merchandising','Store Operations'],
    milestones:[
      {key:'KO',name:'Kick Off',color:'#7357ff',units:['RCPM']},
      {key:'NWT1',name:'NWT1 Submission',color:'#00a3ff',units:['RCPM']},
      {key:'SPR',name:'Space Review & Sign-off',color:'#1f9d68',units:['RCPM','Display']},
      {key:'RSO',name:'Range Review & Sign-off',color:'#3157d5',units:['RCA','Merchandising']},
      {key:'LSO',name:'Layout Review & Sign-off',color:'#7b5de4',units:['Display']},
      {key:'NWT3',name:'NWT3 Submission',color:'#00a3ff',units:['RCPM']},
      {key:'POG',name:'POG Drawing & Sign-off',color:'#d18b12',units:['RCA','Display']},
      {key:'DD',name:'Floor Plan DD & Sign-off',color:'#1685a9',units:['Display']},
      {key:'COMM',name:'Store Communication',color:'#526274',units:['Store Operations']},
      {key:'ORD',name:'Ordering',color:'#e46c3c',units:['Merchandising']},
      {key:'IMP',name:'Implementation',color:'#d44a55',units:['Store Operations']}
    ]
  },
  projects:[{
    id:'p-demo',code:'RCPM-001',name:'Sample Range Change Project',eventType:'Major Range Change',division:'DGF',department:'Grocery',owner:'Project Owner',format:'Hyper',plannedStart:dateOffset(-25),plannedEnd:dateOffset(35),summary:'Project is progressing through range and drawing gates. Focus is to close sign-offs before store communication.',risk:'POG drawing capacity may affect final communication date.',decision:'Confirm final store scope and release drawing resource.',
    activities:[
      activity('a1','Governance','Phase 1','KO',-25,-24,'Completed',[resp('RCPM','Project Owner')],[step('Kick-off completed',-24,'Completed')]),
      activity('a2','Range & Space','Range Sign-off','RSO',-15,-7,'Completed',[resp('RCA','RCA Owner'),resp('Merchandising','Buyer')],[step('Finalize range list',-7,'Completed')]),
      activity('a3','Drawing & Layout','Drawing','POG',-3,8,'InProgress',[resp('RCA','RCA Owner'),resp('Display','Display Owner')],[step('Complete remaining POG drawings',5,'InProgress'),step('Sign-off final drawings',8,'NotStarted')]),
      activity('a4','Store Execution','Communication','COMM',9,15,'Upcoming',[resp('Store Operations','SC Owner')],[step('Prepare store communication pack',12,'NotStarted')]),
      activity('a5','Store Execution','Implementation','IMP',18,32,'Upcoming',[resp('Store Operations','Store Ops')],[step('Confirm implementation readiness',17,'NotStarted')])
    ]
  }], selectedProjectId:'p-demo'
};
function dateOffset(n){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function resp(unit,pic=''){return {unit,pic}}
function step(text,dueOffset,status='NotStarted'){return{id:uid(),text,due:dateOffset(dueOffset),status}}
function activity(id,task,subTask,key,s,e,status,responsibilities,nextSteps=[]){return{id,task,subTask,key,plannedStart:dateOffset(s),plannedEnd:dateOffset(e),actualStart:status==='Completed'?dateOffset(s):'',actualEnd:status==='Completed'?dateOffset(e):'',status,responsibilities,nextSteps}}
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36)}
function clone(x){return JSON.parse(JSON.stringify(x))}
let state=load(); let page='dashboard'; let presentIndex=0; let presentProjectIds=[]; let ganttMode='Week'; let ganttZoom=100;
function load(){try{const x=JSON.parse(localStorage.getItem(STORAGE_KEY));if(x&&x.projects&&x.masters)return x}catch{} return clone(seed)}
function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function project(id=state.selectedProjectId){return state.projects.find(p=>p.id===id)||state.projects[0]}
function ms(key){return state.masters.milestones.find(m=>m.key===key)||{key,name:key,color:'#526274',units:[]}}
function statusPill(s){const cls=s==='InProgress'?'InProgress':s;return `<span class="pill st-${cls}">${STATUS_LABEL[s]||s}</span>`}
function dateVal(s){return s?new Date(s+'T12:00:00').getTime():0}
function days(a,b){return Math.round((dateVal(b)-dateVal(a))/86400000)}
function progress(p){const a=p.activities||[]; if(!a.length)return 0; return Math.round(a.reduce((sum,x)=>sum+(x.status==='Completed'?100:x.status==='InProgress'?60:x.status==='AtRisk'?45:x.status==='Delayed'?35:10),0)/a.length)}
function projectStatus(p){const a=p.activities||[]; if(a.some(x=>x.status==='Delayed'))return'Delayed'; if(a.some(x=>x.status==='AtRisk'))return'AtRisk'; return 'OnTrack'}
function overdueSteps(p){const today=dateVal(dateOffset(0));return (p.activities||[]).flatMap(a=>(a.nextSteps||[]).map(s=>({a,s}))).filter(x=>x.s.status!=='Completed'&&dateVal(x.s.due)<today)}
function upcomingActivities(p,n=14){const t=dateVal(dateOffset(0)),end=t+n*86400000;return (p.activities||[]).filter(a=>dateVal(a.plannedEnd)>=t&&dateVal(a.plannedEnd)<=end&&a.status!=='Completed').sort((a,b)=>dateVal(a.plannedEnd)-dateVal(b.plannedEnd))}
function completedRecent(p,n=21){const t=dateVal(dateOffset(0))-n*86400000;return (p.activities||[]).filter(a=>a.status==='Completed'&&dateVal(a.actualEnd||a.plannedEnd)>=t).sort((a,b)=>dateVal(b.actualEnd||b.plannedEnd)-dateVal(a.actualEnd||a.plannedEnd))}
function setPage(p){page=p;render()}
function renderNav(){const items=[['dashboard','Dashboard'],['projects','Project List'],['detail','Detail Plan'],['presentation','Presentation'],['master','Master Data']];document.getElementById('nav').innerHTML=items.map(([k,l])=>`<button class="${page===k?'active':''}" onclick="setPage('${k}')">${l}</button>`).join('')}
function render(){renderNav();const root=document.getElementById('root'); if(page==='dashboard')root.innerHTML=renderDashboard(); if(page==='projects')root.innerHTML=renderProjects(); if(page==='detail')root.innerHTML=renderDetail(); if(page==='presentation')root.innerHTML=renderPresentation(); if(page==='master')root.innerHTML=renderMaster();}
function startOfWeekMs(msv){const d=new Date(msv);d.setHours(12,0,0,0);const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d.getTime()}
function isoWeek(d){const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));x.setUTCDate(x.getUTCDate()+4-(x.getUTCDay()||7));const y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil((((x-y)/86400000)+1)/7)}
function dashStatus(p){const a=p.activities||[];if(a.length&&a.every(x=>x.status==='Completed'))return'Done';if(a.some(x=>x.status==='Delayed'))return'Delayed';if(a.some(x=>x.status==='AtRisk'))return'At Risk';return'WIP'}
function projectPic(p){const pics=[...new Set((p.activities||[]).flatMap(a=>(a.responsibilities||[]).map(r=>r.pic).filter(Boolean)))];return pics.slice(0,2).join(' / ')||p.owner||'—'}
function renderDashboard(){const ps=state.projects;const now=new Date();const q=Math.floor(now.getMonth()/3)+1;return `<div class="page"><div class="portfolio-head"><div class="portfolio-title"><h1>Portfolio Development plan ${now.getFullYear()}</h1><div class="portfolio-period">Q${q}-${now.getFullYear()}</div></div><div style="display:flex;align-items:center;gap:12px"><div class="portfolio-legend"><span><i class="legend-phase"></i>Active Phase</span><span><i class="legend-ms"></i>Milestone</span></div><button class="btn primary" onclick="openProjectModal()">+ New Project</button></div></div>${renderPortfolioGantt(ps)}</div>`}
function renderPortfolioGantt(ps){if(!ps.length)return`<div class="card portfolio-empty">No projects. Create a project to build the portfolio Gantt.</div>`;const day=86400000,weekW=52;const starts=ps.flatMap(p=>[p.plannedStart,...(p.activities||[]).map(a=>a.plannedStart)]).filter(Boolean).map(dateVal);const ends=ps.flatMap(p=>[p.plannedEnd,...(p.activities||[]).map(a=>a.plannedEnd)]).filter(Boolean).map(dateVal);const today=dateVal(dateOffset(0));let min=Math.min(today,...starts),max=Math.max(today,...ends);min=startOfWeekMs(min-7*day);max=startOfWeekMs(max+14*day)+7*day;const weeks=Math.max(1,Math.ceil((max-min)/(7*day)));const width=weeks*weekW;const weekItems=[];for(let i=0;i<weeks;i++){const dt=new Date(min+i*7*day);weekItems.push({i,dt,label:'W'+String(isoWeek(dt)).padStart(2,'0')})}const monthGroups=[];for(const w of weekItems){const pivot=new Date(w.dt.getTime()+3*day);const key=pivot.getFullYear()+'-'+pivot.getMonth();const label=pivot.toLocaleDateString('en',{month:'long'});const last=monthGroups[monthGroups.length-1];if(last&&last.key===key)last.count++;else monthGroups.push({key,label,count:1})}const months=monthGroups.map(m=>`<div class="portfolio-month" style="width:${m.count*weekW}px">${esc(m.label)}</div>`).join('');const weekHeads=weekItems.map(w=>`<div class="portfolio-week" style="left:${w.i*weekW}px;width:${weekW}px">${w.label}</div>`).join('');const todayX=(today-min)/(7*day)*weekW;const rows=ps.map(p=>{const acts=(p.activities||[]).filter(a=>a.plannedStart&&a.plannedEnd).slice().sort((a,b)=>dateVal(a.plannedEnd)-dateVal(b.plannedEnd));const pStart=Math.max(min,dateVal(p.plannedStart||acts[0]?.plannedStart));const pEnd=Math.min(max,dateVal(p.plannedEnd||acts[acts.length-1]?.plannedEnd));const startX=Math.max(0,(pStart-min)/(7*day)*weekW),endX=Math.min(width,(pEnd-min)/(7*day)*weekW),barW=Math.max(3,endX-startX);const labels=acts.map((a,i)=>{const x=(dateVal(a.plannedEnd)-min)/(7*day)*weekW;if(x<0||x>width)return'';const m=ms(a.key);const title=`${m.key} · ${m.name}\n${a.plannedEnd}\n${STATUS_LABEL[a.status]||a.status}`;return `<span class="portfolio-ms-label" style="left:${x}px;top:${i%2?16:4}px" title="${esc(title)}">${esc(a.key)}</span><i class="portfolio-milestone" style="left:${x}px" title="${esc(title)}"></i>`}).join('');const stat=dashStatus(p),cls=stat==='Delayed'?'delay':stat==='At Risk'?'risk':'';const summary=p.risk?`Issue: ${p.risk}`:(p.summary||p.eventType||'');return `<div class="portfolio-row"><div class="portfolio-process"><span class="project-link" onclick="openDetail('${p.id}')">${esc(p.name)}</span><div class="portfolio-process-summary">${esc(summary)}</div></div><div class="portfolio-pic">${esc(projectPic(p))}</div><div class="portfolio-status ${cls}">${esc(stat)}</div><div class="portfolio-track" style="width:${width}px;background-size:${weekW}px 100%"><div class="portfolio-phase" style="left:${startX}px;width:${barW}px" title="${esc(p.plannedStart)} → ${esc(p.plannedEnd)}"></div>${labels}</div></div>`}).join('');return `<div class="portfolio-gantt-wrap"><div class="portfolio-gantt"><div class="portfolio-axis"><div class="portfolio-left-head"><div>Process</div><div>PIC</div><div>Status</div></div><div class="portfolio-time-head" style="width:${width}px"><div class="portfolio-now-badge" style="left:${todayX}px">We're here</div><div class="portfolio-months">${months}</div><div class="portfolio-weeks">${weekHeads}</div></div></div>${rows}<i class="portfolio-today-line" style="left:${516+todayX}px"></i></div></div>`}
function projectTable(ps){if(!ps.length)return`<div class="empty">No projects.</div>`;return`<div class="table-wrap"><table class="table"><thead><tr><th>Project</th><th>Division</th><th>Owner</th><th>Plan</th><th>Status</th><th>Progress</th><th>Due Soon</th><th>Overdue</th><th></th></tr></thead><tbody>${ps.map(p=>`<tr><td><span class="project-link" onclick="openDetail('${p.id}')">${esc(p.code)} · ${esc(p.name)}</span><div class="small">${esc(p.eventType)}</div></td><td>${esc(p.division)} / ${esc(p.department)}</td><td>${esc(p.owner)}</td><td>${esc(p.plannedStart)} → ${esc(p.plannedEnd)}</td><td>${statusPill(projectStatus(p))}</td><td><b>${progress(p)}%</b><div class="progress"><i style="width:${progress(p)}%"></i></div></td><td>${upcomingActivities(p,14).length}</td><td class="${overdueSteps(p).length?'danger-text':''}">${overdueSteps(p).length}</td><td><button class="btn sm" onclick="openDetail('${p.id}')">Open</button></td></tr>`).join('')}</tbody></table></div>`}
function renderProjects(){return `<div class="page"><div class="page-head"><div><h1>Project List</h1><div class="sub">Create and maintain standalone project plans.</div></div><button class="btn primary" onclick="openProjectModal()">+ New Project</button></div><div class="card section">${projectTable(state.projects)}</div></div>`}
function openDetail(id){state.selectedProjectId=id;save();page='detail';render()}
function renderDetail(){const p=project();if(!p)return`<div class="page"><div class="empty">Create a project first.</div></div>`;const grouped={};(p.activities||[]).forEach(a=>{grouped[a.task]??={};grouped[a.task][a.subTask]??=[];grouped[a.task][a.subTask].push(a)});return `<div class="page"><div class="page-head"><div><h1>${esc(p.code)} · ${esc(p.name)}</h1><div class="sub">${esc(p.eventType)} · ${esc(p.division)} / ${esc(p.department)} · ${esc(p.format)}</div></div><div class="toolbar"><button class="btn" onclick="openProjectModal('${p.id}')">Edit Project</button><button class="btn primary" onclick="openActivityModal()">+ Add Activity</button></div></div><div class="summary-grid"><div class="mini"><span>Status</span><b>${statusPill(projectStatus(p))}</b></div><div class="mini"><span>Progress</span><b>${progress(p)}%</b></div><div class="mini"><span>Owner</span><b>${esc(p.owner)}</b></div><div class="mini"><span>Plan Start</span><b>${esc(p.plannedStart)}</b></div><div class="mini"><span>Plan End</span><b>${esc(p.plannedEnd)}</b></div><div class="mini"><span>Overdue Actions</span><b class="${overdueSteps(p).length?'danger-text':''}">${overdueSteps(p).length}</b></div></div><div class="card section"><div class="section-title" style="display:flex;align-items:center;gap:8px">Gantt Timeline <span class="small">Task → Sub Task → Key Milestone</span><span style="margin-left:auto"></span><select onchange="ganttMode=this.value;render()"><option ${ganttMode==='Day'?'selected':''}>Day</option><option ${ganttMode==='Week'?'selected':''}>Week</option><option ${ganttMode==='Month'?'selected':''}>Month</option></select><button class="btn sm" onclick="ganttZoom=Math.max(25,ganttZoom-25);render()">−</button><span class="small">${ganttZoom}%</span><button class="btn sm" onclick="ganttZoom=Math.min(200,ganttZoom+25);render()">+</button></div>${renderGantt(p)}</div><div class="split" style="margin-top:14px"><div class="card section"><div class="section-title">Detail Plan Structure</div><div class="structure">${Object.entries(grouped).map(([task,subs])=>`<div class="task-card"><div class="task-head"><span>${esc(task)}</span><button class="btn sm" onclick="openActivityModal('',${JSON.stringify(task)})">+ Milestone</button></div>${Object.entries(subs).map(([sub,items])=>`<div class="subtask"><div class="sub-head"><b>${esc(sub)}</b><span class="small">${items.length} milestone(s)</span></div>${items.sort((a,b)=>dateVal(a.plannedStart)-dateVal(b.plannedStart)).map(a=>renderActivity(p,a)).join('')}</div>`).join('')}</div>`).join('')||'<div class="empty">No activities.</div>'}</div></div><div><div class="card section"><div class="section-title">Presentation Notes</div><div class="ff"><label>Project Summary</label><textarea onchange="updateProjectText('summary',this.value)">${esc(p.summary||'')}</textarea></div><div class="ff" style="margin-top:10px"><label>Risk / Issue</label><textarea onchange="updateProjectText('risk',this.value)">${esc(p.risk||'')}</textarea></div><div class="ff" style="margin-top:10px"><label>Decision / Support Needed</label><textarea onchange="updateProjectText('decision',this.value)">${esc(p.decision||'')}</textarea></div><div style="margin-top:12px"><button class="btn primary" onclick="startPresentation('${p.id}')">Present This Project</button></div></div><div class="card section" style="margin-top:14px"><div class="section-title">Upcoming 14 Days</div>${upcomingActivities(p,14).map(a=>`<div class="bullet"><span class="dot"></span><div><b>${esc(a.key)} · ${esc(ms(a.key).name)}</b><div class="small">Due ${esc(a.plannedEnd)} · ${STATUS_LABEL[a.status]}</div></div></div>`).join('')||'<div class="small">No milestone due.</div>'}</div></div></div></div>`}
function renderActivity(p,a){const m=ms(a.key);return `<div class="activity"><div class="code" style="background:${m.color}">${esc(a.key)}</div><div><b>${esc(m.name)}</b><div class="small">${esc(a.task)} → ${esc(a.subTask)}</div></div><div><b>${esc((a.responsibilities||[]).map(r=>r.pic||r.unit).join(', ')||'—')}</b><div class="small">${esc((a.responsibilities||[]).map(r=>r.unit).join(' / '))}</div></div><div>${esc(a.plannedStart)}</div><div>${esc(a.plannedEnd)}</div><div>${statusPill(a.status)}</div><div class="right"><button class="btn sm" onclick="openActivityModal('${a.id}')">Edit</button> <button class="btn sm danger" onclick="deleteActivity('${a.id}')">Delete</button></div></div><div class="next-steps"><div class="small"><b>Next Steps</b></div>${(a.nextSteps||[]).map((s,i)=>`<div class="next-row"><input value="${esc(s.text)}" onchange="updateStep('${a.id}','${s.id}','text',this.value)"><input type="date" value="${esc(s.due)}" onchange="updateStep('${a.id}','${s.id}','due',this.value)"><select onchange="updateStep('${a.id}','${s.id}','status',this.value)"><option value="NotStarted" ${s.status==='NotStarted'?'selected':''}>Not Started</option><option value="InProgress" ${s.status==='InProgress'?'selected':''}>In Progress</option><option value="Completed" ${s.status==='Completed'?'selected':''}>Completed</option></select><button class="btn sm danger" onclick="deleteStep('${a.id}','${s.id}')">×</button></div>`).join('')}<button class="btn sm" style="margin-top:7px" onclick="addStep('${a.id}')">+ Add Next Step</button></div>`}
function renderGantt(p){const acts=(p.activities||[]).slice().sort((a,b)=>dateVal(a.plannedStart)-dateVal(b.plannedStart));if(!acts.length)return'<div class="empty">No activities.</div>';let min=Math.min(...acts.map(a=>dateVal(a.plannedStart))),max=Math.max(...acts.map(a=>dateVal(a.plannedEnd)));const pad=7*86400000;min-=pad;max+=pad;const total=Math.max(1,Math.ceil((max-min)/86400000));let cell=ganttMode==='Day'?22:ganttMode==='Week'?7:ganttMode==='Month'?2.8:7;cell*=ganttZoom/100;const width=Math.max(640,total*cell);const ticks=[];const stride=ganttMode==='Day'?1:ganttMode==='Week'?7:30;for(let d=0;d<=total;d+=stride){const x=d*cell;const dt=new Date(min+d*86400000);ticks.push(`<span class="axis-label" style="left:${x}px">${ganttMode==='Month'?dt.toLocaleDateString('en',{month:'short',year:'2-digit'}):dt.toLocaleDateString('en',{day:'2-digit',month:'short'})}</span>`)}const todayX=(dateVal(dateOffset(0))-min)/86400000*cell;return`<div class="gantt-wrap"><div class="gantt" style="width:${260+width}px"><div class="gantt-axis"><div class="gantt-label"><b>Activity</b></div><div class="axis-track" style="width:${width}px">${ticks.join('')}</div></div>${acts.map(a=>{const start=(dateVal(a.plannedStart)-min)/86400000*cell;const w=Math.max(cell,(days(a.plannedStart,a.plannedEnd)+1)*cell);const m=ms(a.key);return`<div class="gantt-row"><div class="gantt-label"><b>${esc(a.key)}</b> ${esc(m.name)}<div class="small">${esc(a.task)} / ${esc(a.subTask)}</div></div><div class="gantt-track" style="width:${width}px;--cell:${cell*stride}px">${todayX>=0&&todayX<=width?`<i class="today" style="left:${todayX}px"></i>`:''}<div class="gantt-bar" title="${esc(a.plannedStart)} → ${esc(a.plannedEnd)}" style="left:${start}px;width:${w}px;background:${m.color}">${esc(a.key)} · ${STATUS_LABEL[a.status]}</div></div></div>`}).join('')}</div></div>`}
function updateProjectText(field,val){const p=project();p[field]=val;save()}
function addStep(activityId){const a=project().activities.find(x=>x.id===activityId);a.nextSteps??=[];a.nextSteps.push({id:uid(),text:'New action',due:dateOffset(7),status:'NotStarted'});save();render()}
function updateStep(activityId,stepId,field,val){const a=project().activities.find(x=>x.id===activityId);const s=(a.nextSteps||[]).find(x=>x.id===stepId);if(s){s[field]=val;save()}}
function deleteStep(activityId,stepId){const a=project().activities.find(x=>x.id===activityId);a.nextSteps=(a.nextSteps||[]).filter(x=>x.id!==stepId);save();render()}
function deleteActivity(id){if(!confirm('Delete this activity and its Next Steps?'))return;const p=project();p.activities=p.activities.filter(a=>a.id!==id);save();render()}
function openProjectModal(id=''){const p=id?clone(project(id)):{id:uid(),code:'',name:'',eventType:'Major Range Change',division:'',department:'',owner:'',format:'Hyper',plannedStart:dateOffset(0),plannedEnd:dateOffset(30),summary:'',risk:'',decision:'',activities:[]};showModal(`<div class="modal-head"><h2>${id?'Edit':'New'} Project</h2><button class="btn sm" onclick="closeModal()">×</button></div><div class="modal-body"><div class="form-grid">${ff('Code','pmCode',p.code)}${ff('Project Name','pmName',p.name)}${ff('Event Type','pmEvent',p.eventType)}${ff('Division','pmDivision',p.division)}${ff('Department','pmDept',p.department)}${ff('Owner','pmOwner',p.owner)}${ff('Primary Format','pmFormat',p.format)}${ff('Planned Start','pmStart',p.plannedStart,'date')}${ff('Planned End','pmEnd',p.plannedEnd,'date')}</div></div><div class="modal-foot">${id?`<button class="btn danger" onclick="deleteProject('${id}')">Delete Project</button>`:''}<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveProjectModal('${id}')">Save</button></div>`)}
function ff(label,id,value,type='text'){return`<div class="ff"><label>${label}</label><input id="${id}" type="${type}" value="${esc(value)}"></div>`}
function saveProjectModal(id){const vals={code:v('pmCode'),name:v('pmName'),eventType:v('pmEvent'),division:v('pmDivision'),department:v('pmDept'),owner:v('pmOwner'),format:v('pmFormat'),plannedStart:v('pmStart'),plannedEnd:v('pmEnd')};if(!vals.name||!vals.code)return alert('Project Code and Project Name are required.');if(id){Object.assign(project(id),vals)}else{const p={id:uid(),...vals,summary:'',risk:'',decision:'',activities:[]};state.projects.push(p);state.selectedProjectId=p.id}save();closeModal();render()}

function openActivityModal(id='',prefillTask=''){const p=project();const a=id?clone(p.activities.find(x=>x.id===id)):{id:uid(),task:prefillTask||state.masters.tasks[0]||'',subTask:'Main',key:state.masters.milestones[0]?.key||'',plannedStart:dateOffset(0),plannedEnd:dateOffset(7),actualStart:'',actualEnd:'',status:'Upcoming',responsibilities:[],nextSteps:[]};const m=ms(a.key);if(!a.responsibilities.length)a.responsibilities=m.units.map(u=>({unit:u,pic:''}));showModal(`<div class="modal-head"><h2>${id?'Edit':'Add'} Detail Plan Activity</h2><button class="btn sm" onclick="closeModal()">×</button></div><div class="modal-body"><div class="form-grid"><div class="ff"><label>Task</label><select id="amTask">${state.masters.tasks.map(t=>`<option ${t===a.task?'selected':''}>${esc(t)}</option>`).join('')}</select></div>${ff('Sub Task / Phase','amSub',a.subTask)}<div class="ff"><label>Key Milestone</label><select id="amKey" onchange="refreshResponsibilityFields(this.value)">${state.masters.milestones.map(x=>`<option value="${esc(x.key)}" ${x.key===a.key?'selected':''}>${esc(x.key)} — ${esc(x.name)}</option>`).join('')}</select></div><div class="ff"><label>Status</label><select id="amStatus">${STATUS.map(s=>`<option value="${s}" ${s===a.status?'selected':''}>${STATUS_LABEL[s]}</option>`).join('')}</select></div>${ff('Planned Start','amStart',a.plannedStart,'date')}${ff('Planned End','amEnd',a.plannedEnd,'date')}${ff('Actual Start','amAStart',a.actualStart||'','date')}${ff('Actual End','amAEnd',a.actualEnd||'','date')}</div><div style="margin-top:14px"><div class="section-title">PIC / Responsible Persons</div><div id="respFields">${responsibilityFields(a.responsibilities)}</div></div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveActivityModal('${id}')">Save Activity</button></div>`);window._editResp=clone(a.responsibilities)}
function responsibilityFields(list){return(list||[]).map((r,i)=>`<div class="form-grid" style="margin-bottom:8px"><div class="ff"><label>Responsible Unit</label><input value="${esc(r.unit)}" disabled></div><div class="ff"><label>PIC Name</label><input class="respPic" data-unit="${esc(r.unit)}" value="${esc(r.pic||'')}"></div></div>`).join('')||'<div class="small">No unit assigned in Key Milestone Master.</div>'}
function refreshResponsibilityFields(key){const units=ms(key).units;document.getElementById('respFields').innerHTML=responsibilityFields(units.map(u=>({unit:u,pic:''})))}
function saveActivityModal(id){const p=project();const responsibilities=[...document.querySelectorAll('.respPic')].map(x=>({unit:x.dataset.unit,pic:x.value.trim()}));const vals={task:v('amTask'),subTask:v('amSub'),key:v('amKey'),plannedStart:v('amStart'),plannedEnd:v('amEnd'),actualStart:v('amAStart'),actualEnd:v('amAEnd'),status:v('amStatus'),responsibilities};if(!vals.task||!vals.subTask||!vals.key||!vals.plannedStart||!vals.plannedEnd)return alert('Task, Sub Task, Key Milestone and planned dates are required.');if(dateVal(vals.plannedEnd)<dateVal(vals.plannedStart))return alert('Planned End cannot be earlier than Planned Start.');if(id)Object.assign(p.activities.find(x=>x.id===id),vals);else p.activities.push({id:uid(),...vals,nextSteps:[]});if(p.activities.length){p.plannedStart=p.activities.map(a=>a.plannedStart).sort()[0];p.plannedEnd=p.activities.map(a=>a.plannedEnd).sort().slice(-1)[0]}save();closeModal();render()}

function renderPresentation(){if(!presentProjectIds.length)presentProjectIds=state.projects.map(p=>p.id);const p=project(presentProjectIds[presentIndex]||state.selectedProjectId);if(!p)return'<div class="page"><div class="empty">No project to present.</div></div>';const inprog=(p.activities||[]).filter(a=>['InProgress','AtRisk','Delayed'].includes(a.status));const next=(p.activities||[]).flatMap(a=>(a.nextSteps||[]).filter(s=>s.status!=='Completed').map(s=>({a,s}))).sort((x,y)=>dateVal(x.s.due)-dateVal(y.s.due)).slice(0,5);const recent=completedRecent(p).slice(0,4);return`<div class="present-shell"><div class="present-controls" style="max-width:1500px;margin:0 auto 10px;display:flex;gap:8px;color:white;align-items:center"><button class="btn" onclick="presentIndex=Math.max(0,presentIndex-1);render()">← Previous</button><button class="btn" onclick="presentIndex=Math.min(presentProjectIds.length-1,presentIndex+1);render()">Next →</button><span>${presentIndex+1} / ${presentProjectIds.length}</span><span style="margin-left:auto"></span><button class="btn" onclick="window.print()">Print / PDF</button><button class="btn primary" onclick="document.documentElement.requestFullscreen?.()">Full Screen</button></div><section class="slide"><div class="slide-head"><div><div class="slide-title">${esc(p.name)}</div><div class="sub">${esc(p.code)} · ${esc(p.eventType)} · ${esc(p.division)} / ${esc(p.department)}</div></div><div>${statusPill(projectStatus(p))}</div></div><div class="slide-body"><div class="slide-left"><div class="metric-row"><div class="slide-metric"><span>Progress</span><b>${progress(p)}%</b></div><div class="slide-metric"><span>Owner</span><b style="font-size:14px">${esc(p.owner)}</b></div><div class="slide-metric"><span>Upcoming 14D</span><b>${upcomingActivities(p,14).length}</b></div><div class="slide-metric"><span>Overdue</span><b class="${overdueSteps(p).length?'danger-text':''}">${overdueSteps(p).length}</b></div></div><div class="slide-card"><h3>Executive Summary</h3><div>${esc(p.summary||'No summary entered.')}</div></div><div class="slide-card" style="flex:1"><h3>Current Focus / In Progress</h3>${inprog.slice(0,6).map(a=>`<div class="bullet"><span class="dot" style="background:${ms(a.key).color}"></span><div><b>${esc(a.key)} · ${esc(ms(a.key).name)}</b> ${statusPill(a.status)}<div class="small">${esc(a.task)} → ${esc(a.subTask)} · ${esc(a.plannedStart)} → ${esc(a.plannedEnd)}</div></div></div>`).join('')||'<div class="small">No active milestone.</div>'}</div><div class="slide-card"><h3>Recently Completed</h3>${recent.map(a=>`<div class="bullet"><span class="dot" style="background:${ms(a.key).color}"></span><div><b>${esc(a.key)} · ${esc(ms(a.key).name)}</b><div class="small">Completed ${esc(a.actualEnd||a.plannedEnd)}</div></div></div>`).join('')||'<div class="small">No recent completion.</div>'}</div></div><div class="slide-right"><div class="slide-card"><h3>Next Steps</h3>${next.map(x=>`<div class="bullet"><span class="dot"></span><div><b>${esc(x.s.text)}</b><div class="small">${esc(x.a.key)} · Due ${esc(x.s.due)} · ${esc(x.s.status)}</div></div></div>`).join('')||'<div class="small">No open next steps.</div>'}</div><div class="slide-card"><h3>Risk / Issue</h3><div>${esc(p.risk||'No critical risk recorded.')}</div></div><div class="slide-card"><h3>Decision / Support Needed</h3><div>${esc(p.decision||'No decision required.')}</div></div><div class="slide-card" style="flex:1"><h3>Key Milestones</h3>${(p.activities||[]).slice().sort((a,b)=>dateVal(a.plannedEnd)-dateVal(b.plannedEnd)).slice(-7).map(a=>`<div style="display:grid;grid-template-columns:52px 1fr 80px;gap:8px;padding:6px 0;border-bottom:1px solid #edf1f5"><span class="code" style="background:${ms(a.key).color};padding:3px 5px">${esc(a.key)}</span><span>${esc(ms(a.key).name)}</span><span class="small">${esc(a.plannedEnd)}</span></div>`).join('')}</div></div></div><div class="slide-foot"><span>Range Plan Presenter · Standalone Detail Plan</span><span>Updated ${new Date().toLocaleString()}</span></div></section></div>`}
function renderMaster(){return`<div class="page"><div class="page-head"><div><h1>Master Data</h1><div class="sub">Maintain selectable values used by Detail Plan.</div></div></div><div class="master-grid"><div class="card master-list"><div class="section-title">Task Master <button class="btn sm primary" style="float:right" onclick="addMasterTask()">+</button></div>${state.masters.tasks.map((t,i)=>`<div class="master-item"><span>${i+1}. ${esc(t)}</span><span><button class="btn sm" onclick="moveItem('tasks',${i},-1)">↑</button> <button class="btn sm" onclick="moveItem('tasks',${i},1)">↓</button> <button class="btn sm danger" onclick="deleteMaster('tasks',${i})">×</button></span></div>`).join('')}</div><div class="card master-list"><div class="section-title">Key Milestone Master <button class="btn sm primary" style="float:right" onclick="addMilestoneMaster()">+</button></div>${state.masters.milestones.map((m,i)=>`<div class="master-item"><span><i class="color-dot" style="background:${m.color}"></i><b>${esc(m.key)}</b> · ${esc(m.name)}<div class="small">${esc(m.units.join(' / '))}</div></span><span><button class="btn sm" onclick="moveItem('milestones',${i},-1)">↑</button> <button class="btn sm" onclick="moveItem('milestones',${i},1)">↓</button> <button class="btn sm" onclick="editMilestoneMaster(${i})">Edit</button></span></div>`).join('')}</div><div class="card master-list"><div class="section-title">Responsible Unit Master <button class="btn sm primary" style="float:right" onclick="addUnitMaster()">+</button></div>${state.masters.units.map((u,i)=>`<div class="master-item"><span>${i+1}. ${esc(u)}</span><span><button class="btn sm" onclick="moveItem('units',${i},-1)">↑</button> <button class="btn sm" onclick="moveItem('units',${i},1)">↓</button> <button class="btn sm danger" onclick="deleteMaster('units',${i})">×</button></span></div>`).join('')}</div></div></div>`}
function moveItem(type,i,d){const a=state.masters[type],j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render()}
function deleteMaster(type,i){if(!confirm('Delete this master item?'))return;state.masters[type].splice(i,1);save();render()}
function addMasterTask(){const x=prompt('Task name');if(x&&!state.masters.tasks.includes(x)){state.masters.tasks.push(x.trim());save();render()}}
function addUnitMaster(){const x=prompt('Responsible Unit name');if(x&&!state.masters.units.includes(x)){state.masters.units.push(x.trim());save();render()}}
function addMilestoneMaster(){showMilestoneModal(-1)}function editMilestoneMaster(i){showMilestoneModal(i)}
function showMilestoneModal(i){const m=i>=0?clone(state.masters.milestones[i]):{key:'',name:'',color:COLORS[state.masters.milestones.length%COLORS.length],units:[]};showModal(`<div class="modal-head"><h2>${i>=0?'Edit':'Add'} Key Milestone</h2><button class="btn sm" onclick="closeModal()">×</button></div><div class="modal-body"><div class="form-grid">${ff('Code','mmKey',m.key)}${ff('Milestone Name','mmName',m.name)}<div class="ff"><label>Color</label><input id="mmColor" type="color" value="${esc(m.color)}"></div><div class="ff"><label>Responsible Units</label><select id="mmUnits" multiple size="5">${state.masters.units.map(u=>`<option ${m.units.includes(u)?'selected':''}>${esc(u)}</option>`).join('')}</select></div></div></div><div class="modal-foot">${i>=0?`<button class="btn danger" onclick="deleteMilestoneMaster(${i})">Delete</button>`:''}<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveMilestoneMaster(${i})">Save</button></div>`)}
function saveMilestoneMaster(i){const key=v('mmKey').toUpperCase(),name=v('mmName'),color=document.getElementById('mmColor').value,units=[...document.getElementById('mmUnits').selectedOptions].map(o=>o.value);if(!key||!name)return alert('Code and Name required.');const m={key,name,color,units};if(i>=0)state.masters.milestones[i]=m;else state.masters.milestones.push(m);save();closeModal();render()}
function deleteMilestoneMaster(i){const key=state.masters.milestones[i].key;if(state.projects.some(p=>p.activities.some(a=>a.key===key)))return alert('This milestone is used by a project and cannot be deleted.');state.masters.milestones.splice(i,1);save();closeModal();render()}
function exportJson(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='range-plan-presenter-backup-'+dateOffset(0)+'.json';a.click();URL.revokeObjectURL(a.href)}
function importJson(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.projects||!x.masters)throw new Error('Invalid backup');state=x;save();render();alert('Import completed.')}catch(err){alert(err.message)}};r.readAsText(f);e.target.value=''}
async function syncServer(){try{const res=await fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)});const x=await res.json();if(!x.ok)throw new Error(x.error||'Save failed');alert('Server state saved.')}catch(e){alert('Server save failed: '+e.message)}}
render();
</script>
</body>
