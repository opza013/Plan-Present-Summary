<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Range Operation Platform v2.0</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">Range Operation Platform</div>
    <nav class="nav" id="nav"></nav>
    <div class="toolbar">
      <button class="btn sm" onclick="exportJson()">Export</button>
      <button class="btn sm" onclick="document.getElementById('importFile').click()">Import</button>
      <input id="importFile" type="file" accept="application/json" hidden onchange="importJson(event)">
      <span id="syncStatus" class="sync-status local">Local</span>
      <button class="btn sm" onclick="openTeamCenter()">Team & History</button>
      <button class="btn sm" onclick="syncServer()">Sync Now</button>
    </div>
  </header>
  <main id="root"></main>
</div>
<div id="modal" class="modal hidden"><div class="modal-card" id="modalCard"></div></div>
<script src="/seed-data.js"></script>
<script src="/app.js"></script>
</body>
</html>
